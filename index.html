<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA 2025-26 — Painel de Temporada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.32.0/plotly.min.js"></script>
<style>
  /* =====================================================
     CONFIGURAÇÃO — troque pelos valores do seu projeto Supabase.
     A anon key é segura de expor aqui: RLS só libera SELECT
     (ver schema.sql).
     ===================================================== */

  :root{
    --primary:#007A33;
    --secondary:#BA9653;
    --bg:#F4F5F3;
    --surface:#FFFFFF;
    --surface-2:#EEF0EC;
    --line:#E1E4DE;
    --text:#1A1F1B;
    --muted:#6E756E;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(115deg, #00000004 0 2px, transparent 2px 34px),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }

  .display{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.02em;}
  .mono{font-family:'Roboto Mono',monospace;}

  /* ---------- header ---------- */
  header.court{
    display:flex; align-items:center; gap:20px;
    padding:22px 28px;
    background:var(--surface);
    border-bottom:3px solid var(--secondary);
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .badge-wrap{
    width:56px; height:56px; border-radius:50%;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    border:3px solid var(--secondary);
    flex-shrink:0; overflow:hidden;
    transition:border-color .25s ease;
  }
  .badge{
    width:76%; height:76%;
    object-fit:contain;
  }
  header.court h1{
    font-size:26px; margin:0; font-weight:700;
    color:var(--text);
  }
  header.court .sub{
    color:var(--primary); font-size:12px; letter-spacing:.14em; margin-top:2px; font-weight:600;
  }
  header .spacer{flex:1;}

  select, input[type="search"]{
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 12px;
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  select:focus, input:focus{outline:2px solid var(--secondary); outline-offset:1px;}

  /* ---------- layout ---------- */
  main{padding:24px 28px 48px; max-width:1360px; margin:0 auto;}

  .kpi-row{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;
    margin-bottom:22px;
  }
  .kpi{
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom:3px solid var(--secondary);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .kpi .value{
    font-family:'Oswald',sans-serif; font-size:34px; font-weight:600;
    color:var(--primary);
    line-height:1;
  }
  .kpi .label{
    color:var(--muted); font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; margin-top:8px;
  }

  .grid-2{
    display:grid; grid-template-columns:1.3fr 1fr; gap:18px;
    margin-bottom:18px;
  }
  @media (max-width:900px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px 20px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .panel h2{
    font-family:'Oswald',sans-serif; font-size:15px; text-transform:uppercase;
    letter-spacing:.06em; margin:0 0 14px; color:var(--text);
    border-left:3px solid var(--primary); padding-left:10px;
  }

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; color:var(--muted); font-weight:600;
    font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    padding:8px 10px; border-bottom:1px solid var(--line);
    cursor:pointer; user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--secondary);}
  tbody td{padding:8px 10px; border-bottom:1px solid var(--line);}
  tbody tr:hover{background:var(--surface-2);}
  .table-wrap{max-height:420px; overflow:auto;}

  .stat{color:var(--primary); font-family:'Roboto Mono',monospace; font-weight:600;}

  .state-msg{
    color:var(--muted); font-size:13px; padding:30px 10px; text-align:center;
  }
  .state-msg.error{color:#E0665A;}
</style>
</head>

};

let allData = [];
let sortState = { key: "pts", dir: "desc" };

async function fetchData() {
  const url = `${CONFIG.SUPABASE_URL}/rest/v1/vw_player_stats?select=*&season=eq.2025-26`;
  const res = await fetch(url, {
    headers: {
      apikey: CONFIG.SUPABASE_ANON_KEY,
      Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
    },
  });
  if (!res.ok) throw new Error(`Supabase respondeu ${res.status}`);
  return res.json();
}

function applyTeamTheme(abbr) {
  const colors = abbr ? (TEAM_COLORS[abbr] || NBA_COLORS) : NBA_COLORS;
  document.documentElement.style.setProperty("--primary", colors[0]);
  document.documentElement.style.setProperty("--secondary", colors[1]);
  const badge = document.getElementById("teamBadge");
  badge.src = abbr ? (TEAM_LOGOS[abbr] || NBA_LOGO_PATH) : NBA_LOGO_PATH;
  badge.alt = abbr || "NBA";
}

function getFiltered() {
  const team = document.getElementById("teamFilter").value;
  const search = document.getElementById("searchPlayer").value.trim().toLowerCase();
  return allData.filter(r =>
    (!team || r.team_abbreviation === team) &&
    (!search || r.player_name.toLowerCase().includes(search))
  );
}

function fmt(n, digits = 1) {
  return (n === null || n === undefined) ? "—" : Number(n).toFixed(digits);
}

function renderKpis(rows) {
  const avg = key => rows.length ? rows.reduce((s, r) => s + (Number(r[key]) || 0), 0) / rows.length : 0;
  document.getElementById("kpiPts").textContent = fmt(avg("pts"));
  document.getElementById("kpiTs").textContent = fmt(avg("ts_pct") * 100) + "%";
  document.getElementById("kpiUsg").textContent = fmt(avg("usg_pct") * 100) + "%";
  document.getElementById("kpiNet").textContent = fmt(avg("net_rating"));
}

function renderTable(rows) {
  const sorted = [...rows].sort((a, b) => {
    const va = a[sortState.key], vb = b[sortState.key];
    const dir = sortState.dir === "asc" ? 1 : -1;
    if (typeof va === "string") return va.localeCompare(vb) * dir;
    return ((va || 0) - (vb || 0)) * dir;
  });
  const body = document.getElementById("playerTableBody");
  if (!sorted.length) {
    body.innerHTML = `<tr><td colspan="8" class="state-msg">Nenhum jogador encontrado.</td></tr>`;
    return;
  }
  body.innerHTML = sorted.map(r => `
    <tr>
      <td>${r.player_name}</td>
      <td>${r.team_abbreviation}</td>
      <td>${fmt(r.age, 0)}</td>
      <td class="stat">${fmt(r.pts)}</td>
      <td class="stat">${fmt(r.ts_pct * 100)}%</td>
      <td class="stat">${fmt(r.usg_pct * 100)}%</td>
      <td class="stat">${fmt(r.net_rating)}</td>
      <td>${r.college || "—"}</td>
    </tr>
  `).join("");
}

function renderCharts(rows) {
  const top = [...rows].sort((a, b) => (b.pts || 0) - (a.pts || 0)).slice(0, 10).reverse();
  const primary = getComputedStyle(document.documentElement).getPropertyValue("--primary").trim();
  const secondary = getComputedStyle(document.documentElement).getPropertyValue("--secondary").trim();
  const textColor = getComputedStyle(document.documentElement).getPropertyValue("--text").trim();

  const layoutBase = {
    paper_bgcolor: "transparent",
    plot_bgcolor: "transparent",
    font: { color: textColor, family: "Inter, sans-serif", size: 12 },
    margin: { t: 10, r: 20, l: 120, b: 40 },
  };

  Plotly.newPlot("chartTopScorers", [{
    type: "bar", orientation: "h",
    x: top.map(r => r.pts), y: top.map(r => r.player_name),
    marker: { color: primary },
  }], { ...layoutBase, margin: { t: 10, r: 20, l: 140, b: 40 } }, { displayModeBar: false, responsive: true });

  Plotly.newPlot("chartScatter", [{
    type: "scatter", mode: "markers",
    x: rows.map(r => r.usg_pct), y: rows.map(r => r.ts_pct),
    text: rows.map(r => r.player_name),
    marker: {
      size: rows.map(r => Math.max(6, (r.pts || 0) * 1.4)),
      color: primary, opacity: 0.75,
      line: { color: secondary, width: 1.5 },
    },
  }], {
    ...layoutBase,
    margin: { t: 10, r: 20, l: 55, b: 45 },
    xaxis: { title: "USG%", tickformat: ".0%", gridcolor: "#00000014", zerolinecolor: "#00000022" },
    yaxis: { title: "TS%", tickformat: ".0%", gridcolor: "#00000014", zerolinecolor: "#00000022" },
  }, { displayModeBar: false, responsive: true });
}

function renderAll() {
  const rows = getFiltered();
  renderKpis(rows);
  renderTable(rows);
  renderCharts(rows);
}

function populateTeamFilter() {
  const teams = [...new Map(allData.map(r => [r.team_abbreviation, r.team_name])).entries()]
    .sort((a, b) => a[1].localeCompare(b[1]));
  const select = document.getElementById("teamFilter");
  select.innerHTML = `<option value="">Liga toda</option>` +
    teams.map(([abbr, name]) => `<option value="${abbr}">${name}</option>`).join("");
  select.value = "BOS"; // default: Celtics
}

async function init() {
  try {
    allData = await fetchData();
    populateTeamFilter();
    document.getElementById("teamFilter").dispatchEvent(new Event("change"));
  } catch (err) {
    document.getElementById("playerTableBody").innerHTML =
      `<tr><td colspan="8" class="state-msg error">Erro ao carregar dados: ${err.message}.
       Confira SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo.</td></tr>`;
  }
}

document.getElementById("teamFilter").addEventListener("change", (e) => {
  const abbr = e.target.value;
  applyTeamTheme(abbr);
  const teamName = e.target.selectedOptions[0]?.textContent || "Liga toda";
  document.getElementById("teamTitle").textContent = abbr ? teamName : "NBA — Temporada 2025-26";
  document.getElementById("teamSub").textContent = abbr ? "TEMPORADA 2025-26" : "TODOS OS TIMES";
  renderAll();
});

document.getElementById("searchPlayer").addEventListener("input", renderAll);

document.querySelectorAll("thead th[data-key]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    sortState.dir = (sortState.key === key && sortState.dir === "desc") ? "asc" : "desc";
    sortState.key = key;
    renderAll();
  });
});

init();
</script>
